plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.memolake'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', '2.0.2')
    set('commonmarkVersion', '0.32.0')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    // Memo viewer: Markdown -> HTML (commonmark-java, GitHub flavoured extensions) sanitized with jsoup.
    implementation "org.commonmark:commonmark:${commonmarkVersion}"
    implementation "org.commonmark:commonmark-ext-gfm-tables:${commonmarkVersion}"
    implementation "org.commonmark:commonmark-ext-gfm-strikethrough:${commonmarkVersion}"
    implementation "org.commonmark:commonmark-ext-autolink:${commonmarkVersion}"
    implementation "org.commonmark:commonmark-ext-task-list-items:${commonmarkVersion}"
    implementation "org.commonmark:commonmark-ext-heading-anchor:${commonmarkVersion}"
    implementation 'org.jsoup:jsoup:1.24.1'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Keep parameter names so MCP tool / Spring MVC binding can use them.
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Only the executable Spring Boot jar is needed.
tasks.named('jar') {
    enabled = false
}

tasks.named('bootJar') {
    archiveFileName = 'memolake.jar'
}
